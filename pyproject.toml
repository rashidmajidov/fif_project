[project]
name = "fif_project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "plotly",
    "ipykernel",
    "pyarrow>=25.0.1",
    "fastparquet>=2026.5.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
